services:
  - type: web
    name: apuracao-api
    branch: prod
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: boletins
      - key: FRONTEND_URL
        sync: false
      - key: OPERATOR_FRONTEND_URL
        sync: false
      - key: OPERATOR_ACCESS_MODE
        value: "proxy"
      - key: OPERATOR_PROXY_KEY
        sync: false
      - key: PREVIEW_SECRET_KEY
        sync: false
      - key: MAX_PDF_SIZE_MB
        value: "10"
      - key: PREVIEW_TTL_SECONDS
        value: "900"
      - key: IMPORT_MAX_CONCURRENT
        value: "5"
      - key: REQUEST_BODY_TIMEOUT_SECONDS
        value: "120"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: PDF_WORKERS
        value: "2"
      - key: PDF_MAX_PENDING
        value: "10"
      - key: STORAGE_MAX_CONNECTIONS
        value: "10"
      - key: STORAGE_TIMEOUT_SECONDS
        value: "45"
