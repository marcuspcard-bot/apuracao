name: Verify
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apuracao
          POSTGRES_PASSWORD: apuracao
          POSTGRES_DB: apuracao
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U apuracao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://apuracao:apuracao@localhost:55432/apuracao
      TEST_DATABASE_URL: postgresql+psycopg://apuracao:apuracao@localhost:55432/apuracao
      FRONTEND_URL: http://localhost:5174
      VITE_API_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          echo "PREVIEW_SECRET_KEY=$(.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Test backend
        working-directory: backend
        run: |
          .venv/bin/ruff check app tests
          .venv/bin/pytest -q
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            .artifacts/*.png
            frontend/test-results/
